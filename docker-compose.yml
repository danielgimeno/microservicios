services:
  stock-service:
    build: ./stock-service-php
    container_name: stock-service
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost:8081/health') ? 0 : 1);"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 5s

  notification-service:
    build: ./notification-service-java
    container_name: notification-service
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/v1/notifications/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 30s

  order-service:
    build: ./order-service-node
    container_name: order-service
    ports:
      - "8080:8080"
    environment:
      STOCK_SERVICE_URL: http://stock-service:8081
      NOTIFICATION_SERVICE_URL: http://notification-service:8082
    depends_on:
      stock-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  kong:
    image: kong:3.9
    container_name: kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /opt/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002
    volumes:
      - ./kong/kong.yml:/opt/kong/kong.yml:ro
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"
    depends_on:
      order-service:
        condition: service_healthy
      stock-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy

networks:
  default:
    name: purchase-pipeline-net
